#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Lily Acadia Gilbert"
email = "lily@informedk12.com"

[aliases]
a = ["bookmark", "advance"]
bc = ["bookmark", "create"]
c = ["commit"]
ci = ["commit", "-i"]
d = ["diff"]
e = ["edit"]
r = ["rebase", "-b", "bookmarks() ~ main & mine()", "-d", "main", "--skip-emptied"]
s = ["squash"]
si = ["squash", "-i"]
logm = ["log", "-r", "::main"]
p = ["git", "push", "--tracked"]
pr = [
  "util", "exec", "--", "bash", "-c", """
  bookmark=$(jj log --no-graph -r "ancestors(@) & bookmarks() ~ main" -T 'bookmarks')
  bookmark=$(echo "$bookmark" | sed "s/\\*\\$//")
  gh pr create --fill --draft --assignee "@me" --head "$bookmark"
  """
]
lint = [
  "util", "exec", "--", "sh", "-c", """
    jj diff --name-only -r @ -- 'root-glob:**/*.rb' | \
      xargs rubocop -A --force-exclusion
    jj diff --name-only -r @ -- "root-glob:'**/*.{js,jsx,ts,tsx}'" | \
      xargs ./node_modules/eslint/bin/eslint.js --cache --fix
    jj diff --name-only -r @ -- 'root-glob:**/*.haml' | \
      xargs haml-lint
  """
]

[revsets]
bookmark-advance-to = "coalesce((@ & ~empty()), @-)"

[remotes.origin]
auto-track-created-bookmarks = "*"

[ui]
pager = "delta"
diff-editor = ":builtin"
diff-formatter = ":git"
